<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon vote européen — PolitiLab</title>
  <meta name="description" content="Clique sur les pays, choisis tes partis et visualise ton vote sur la carte.">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/europe.css">

  <!-- Fonts cohérentes avec ton autre page -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

  <!-- NAV -->
  
  <div class="page-wrap">

    <div class="jrn-layout">

      <!-- ── HEADER ── -->
      <header class="jrn-header">
        <h1 class="jrn-title">
          Mon vote <em>européen</em>
        </h1>
        <p class="jrn-sub">
          Clique sur un pays · Choisis ton parti · Visualise ton influence
        </p>
      </header>

      <!-- ── ACTION BAR ── -->
      <div class="jrn-controls">
        <button class="btn btn-primary" onclick="showResult()">
          🗳 Voir mon résultat
        </button>

        <button class="btn btn-ghost" onclick="resetMap()">
          Effacer
        </button>
      </div>

      <!-- ── MAIN CARD (MAP) ── -->
      <section class="jrn-canvas-wrap">

        <div class="jrn-canvas-scroller">

          <div id="map-section" class="europe-map-wrap">

            <svg id="europe-svg" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
              <rect width="900" height="700" fill="#0b0f1a" rx="12"/>
            </svg>

            <!-- Tooltip -->
            <div id="tooltip"></div>

            <!-- Empty state -->
            <div id="empty-state">
              <div class="empty-icon">🌍</div>
              <div class="empty-text">Clique sur un pays pour commencer</div>
              <div class="empty-hint">Choisis ensuite un parti politique</div>
            </div>

          </div>

        </div>

        <!-- FOOTER INFO -->
        <div class="jrn-canvas-footer">
          <span id="info" class="jrn-info">0 pays sélectionnés</span>
          <span class="jrn-hint">🗳 Clique pour voter</span>
        </div>

      </section>

      <!-- ── SELECTED PARTIES ── -->
      <section class="jrn-suggestions">

        <div class="jrn-suggestions-label">
          Partis sélectionnés
        </div>

        <div class="jrn-suggestions-list" id="chosen-logos">
          <!-- JS inject -->
        </div>

      </section>

    </div>

  </div>

  <!-- ── MODAL PARTI ── -->
  <div class="modal-bg" id="modal-bg">
    <div class="modal">

      <button class="modal-close" onclick="closeModal()">✕</button>

      <div class="modal-country" id="modal-country-name"></div>

      <div class="parties-list" id="parties-list"></div>

    </div>
  </div>

  <!-- ── RESULT MODAL ── -->
  <div class="result-modal" id="result-modal">
    <div class="result-box">

      <h2>Mes partis soutenus</h2>

      <div class="result-grid" id="result-grid"></div>

      <div class="result-btns">
        <button class="btn btn-primary" onclick="copyResult()">📋 Copier</button>
        <button class="btn btn-ghost" onclick="closeResult()">Fermer</button>
      </div>

    </div>
  </div>

  <script src="js/nav.js"></script>
  <script src="js/europe.js"></script>

</body>
</html>
