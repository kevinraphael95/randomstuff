<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon vote européen — PolitiLab</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f5f0e8;
      --primary:#1a1a2e;
      --accent:#e8c84a;
      --border:#e8e8e8;
      --radius:12px;
    }

    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      background:var(--bg);
      font-family:'DM Sans',sans-serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      min-height:100vh;
    }

    /* HEADER */
    .app-header{
      width:100%;
      text-align:center;
      padding:16px;
      background:#fff;
      border-bottom:2px solid #ddd;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
    }

    .app-title{
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(1.6rem,3vw,2.5rem);
      letter-spacing:2px;
      color:var(--primary);
    }

    .app-sub{
      font-size:.85rem;
      color:#777;
    }

    /* MAP */
    .map-container{
      position:relative;
      max-width:1000px;
      width:100%;
      padding:16px;
    }

    svg{
      width:100%;
      filter:drop-shadow(0 4px 20px rgba(0,0,0,.12));
    }

    .country{
      fill:#f0ece3;
      stroke:#bbb;
      cursor:pointer;
      transition:.2s;
    }

    .country:hover{fill:#dde8f5;}
    .country--selected{fill:#e8f5e8;}

    /* BUTTONS */
    .btn{
      border:none;
      border-radius:8px;
      padding:10px 18px;
      cursor:pointer;
      font-family:'Bebas Neue',sans-serif;
      letter-spacing:1px;
    }

    .btn-primary{background:var(--primary);color:#fff;}
    .btn-secondary{background:#eee;}

    /* MODAL */
    .modal-bg{
      position:fixed;
      inset:0;
      display:none;
      align-items:flex-end;
      justify-content:center;
      background:rgba(0,0,0,.5);
    }

    .modal-bg.active{display:flex;}

    .modal{
      background:#fff;
      width:100%;
      max-width:600px;
      border-radius:20px 20px 0 0;
      padding:20px;
      max-height:80vh;
      overflow:auto;
    }

    /* PARTY GRID */
    .party-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
      gap:10px;
    }

    .party-card{
      border:2px solid var(--border);
      border-radius:var(--radius);
      padding:10px;
      text-align:center;
      cursor:pointer;
      transition:.2s;
    }

    .party-card:hover{
      transform:translateY(-2px);
      border-color:var(--primary);
    }

    .party-card--active{
      border-color:#2a7a2a;
      background:#f0fff0;
    }

    /* FOOTER BAR */
    .summary{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      background:var(--primary);
      color:#fff;
      padding:12px;
      display:flex;
      justify-content:space-between;
      transform:translateY(100%);
      transition:.3s;
    }

    .summary.visible{transform:translateY(0);}

    /* TOOLTIP */
    .tooltip{
      position:fixed;
      background:var(--primary);
      color:#fff;
      padding:4px 10px;
      border-radius:6px;
      font-size:.75rem;
      opacity:0;
      pointer-events:none;
      transition:.15s;
      will-change:transform,opacity;
    }

  </style>
</head>

<body>

  <header class="app-header">
    <h1 class="app-title">Mon vote européen</h1>
    <p class="app-sub">Clique · Choisis · Visualise</p>
  </header>

  <div class="map-container">
    <svg viewBox="0 0 900 700"></svg>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <div class="summary" id="summary">
    <span>0 pays sélectionnés</span>
    <button class="btn btn-primary">Partager</button>
  </div>

  <div class="modal-bg" id="modal">
    <div class="modal">
      <h2>Pays</h2>
      <div class="party-grid"></div>
    </div>
  </div>

</body>
</html>
