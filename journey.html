<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Political Journey — PolitiLab</title>
  <meta name="description" content="Retracez l'évolution de vos idées politiques. Ajoutez vos idéologies, exportez en PNG.">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/journey.css">
</head>

<body>

<div class="page-wrap">
  <div class="jrn-wrap">

    <!-- Header -->
    <div class="jrn-header">
      <h1 class="jrn-title">My Political <em>Journey</em></h1>
      <p class="jrn-sub">Ajoute jusqu'à 10 idéologies · Génère ton poster · Export PNG</p>
    </div>

    <!-- Controls -->
    <div class="jrn-controls">
      <div class="jrn-input-wrap">
        <input id="search" placeholder="Chercher une idéologie…" maxlength="40" autocomplete="off"/>
        <span class="jrn-char-count" id="char-count">0/40</span>
      </div>

      <button class="btn btn-primary" onclick="addIdeology()">Ajouter</button>
      <button class="btn btn-ghost" onclick="resetAll()">Effacer</button>
      <button class="btn btn-teal" onclick="exportPNG()">Export PNG</button>
    </div>

    <!-- Canvas -->
    <div class="jrn-canvas-wrap">
      <div class="jrn-canvas-scroller">
        <div id="journey">

          <svg id="arrow-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
            <polyline id="stair-line" fill="none" stroke="#111" stroke-width="2"/>
          </svg>

          <div id="title-label">MY<br>POLITICAL<br>JOURNEY</div>

          <div id="empty-state">
            <div class="empty-icon">📍</div>
            <div class="empty-text">Ajoute ta première idéologie</div>
          </div>

        </div>
      </div>

      <div class="jrn-canvas-footer">
        <span id="info">0 / 10 idéologies</span>
      </div>
    </div>

    <!-- Suggestions -->
    <div class="jrn-suggestions">
      <div class="jrn-suggestions-list" id="suggestions"></div>
    </div>

  </div>
</div>

<script src="js/journey.js"></script>

</body>
</html>
