<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Political Journey — PolitiLab</title>
  <meta name="description" content="Retracez l'évolution de vos idées politiques. Ajoutez vos idéologies, exportez en PNG.">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/journey.css">
</head>
<body>

  <!-- Nav injectée par nav.js -->

  <div class="page-wrap">
    <div class="jrn-wrap">

      <!-- ── Header ── -->
      <div class="jrn-header">
        <h1 class="jrn-title">My Political <em>Journey</em></h1>
        <p class="jrn-sub">Ajoute jusqu'à 10 idéologies · Génère ton poster · Exporte en PNG</p>
      </div>

      <!-- ── Controls ── -->
      <div class="jrn-controls">
        <div class="jrn-input-wrap">
          <input
            list="ideo-list"
            id="search"
            placeholder="Chercher une idéologie…"
            maxlength="40"
            autocomplete="off"
          />
          <datalist id="ideo-list"></datalist>
          <span class="jrn-char-count" id="char-count">0/40</span>
        </div>
        <button class="btn btn-primary" id="btn-add" onclick="addIdeology()">
          <span id="btn-add-label">Ajouter</span>
        </button>
        <button class="btn btn-ghost" onclick="resetAll()">Effacer</button>
        <button class="btn btn-teal" onclick="exportPNG()">↓ Export PNG</button>
      </div>

      <!-- ── Canvas ── -->
      <div class="jrn-canvas-wrap">
        <div class="jrn-canvas-scroller">
          <div id="journey">
            <svg id="arrow-svg" viewBox="0 0 760 480">
              <defs>
                <marker id="arr" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
                  <polygon class="arrow-fill" points="0 0, 12 4, 0 8" fill="#111"/>
                </marker>
              </defs>
              <polyline id="stair-line" class="arrow-stroke" fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round" marker-end="url(#arr)"/>
            </svg>
            <div id="title-label">MY<br>POLITICAL<br>JOURNEY!</div>
            <div id="empty-state">
              <div class="empty-icon">📍</div>
              <div class="empty-text">Ajoute ta première idéologie ci-dessus</div>
              <div class="empty-hint">ex : Socialisme, Libéralisme, Anarchisme…</div>
            </div>
          </div>
        </div>
        <div class="jrn-canvas-footer">
          <span id="info" class="jrn-info">0 / 10 idéologies</span>
          <span class="jrn-hint">⭐ = idéologie personnalisée</span>
        </div>
      </div>

      <!-- ── Suggestions ── -->
      <div class="jrn-suggestions">
        <div class="jrn-suggestions-label">Suggestions populaires</div>
        <div class="jrn-suggestions-list" id="suggestions"></div>
      </div>

    </div>
  </div>

  <script src="js/nav.js"></script>
  <script src="js/journey.js"></script>
</body>
</html>
