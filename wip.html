<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Political Journey — En travaux</title>
  <meta name="description" content="Cette page est en cours de développement.">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/journey.css">
</head>
<body>

  <!-- Nav injectée par nav.js -->

  <div class="page-wrap">
    <div class="jrn-wrap">

      <!-- ── Header ── -->
      <div class="jrn-header">
        <h1 class="jrn-title">Page <em>en travaux</em></h1>
        <p class="jrn-sub">Cette fonctionnalité est actuellement en cours de développement</p>
      </div>

      <!-- ── Controls ── -->
      <div class="jrn-controls">
        <div class="jrn-input-wrap">
          <input
            id="search"
            placeholder="Fonction indisponible…"
            maxlength="40"
            autocomplete="off"
            disabled
          />
          <span class="jrn-char-count">0/40</span>
        </div>
        <button class="btn btn-primary" disabled>
          Indisponible
        </button>
        <button class="btn btn-ghost" disabled>Effacer</button>
        <button class="btn btn-teal" disabled>Export PNG</button>
      </div>

      <!-- ── Canvas ── -->
      <div class="jrn-canvas-wrap">
        <div class="jrn-canvas-scroller">
          <div id="journey">
            <div id="title-label">EN<br>TRAVAUX</div>
            <div id="empty-state">
              <div class="empty-icon">🚧</div>
              <div class="empty-text">Cette page n'est pas encore disponible</div>
              <div class="empty-hint">Reviens plus tard 👀</div>
            </div>
          </div>
        </div>

        <div class="jrn-canvas-footer">
          <span class="jrn-info">Développement en cours</span>
          <span class="jrn-hint">PolitiLab</span>
        </div>
      </div>

      <!-- ── Suggestions ── -->
      <div class="jrn-suggestions">
        <div class="jrn-suggestions-label">Bientôt disponible</div>
        <div class="jrn-suggestions-list"></div>
      </div>

    </div>
  </div>

  <script src="js/nav.js"></script>
</body>
</html>
